global
    log stdout format raw local0
    maxconn 2048
    stats socket /run/haproxy/admin.sock mode 660 group control level admin
    stats timeout 5s

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout http-request 5s
    timeout connect 1s
    timeout check 1s
    timeout client 5s
    timeout server 3s
    timeout queue 1s
    timeout http-keep-alive 5s
    # Never replay a payment POST after an ambiguous response or timeout.
    retries 0
    retry-on none

resolvers docker
    nameserver local 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s
    hold nx 2s
    hold timeout 2s
    hold refused 2s
    hold other 2s
    hold obsolete 2s

frontend authorizations
    bind :8080
    default_backend transaction_engine

frontend monitoring
    bind :8404
    http-request use-service prometheus-exporter if { path /metrics }
    http-request return status 200 content-type text/plain string ready if { path /health }
    http-request deny deny_status 404

backend transaction_engine
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host transaction-engine
    http-check expect status 200
    default-server inter 1s fastinter 500ms downinter 1s fall 2 rise 2 init-state fully-down resolvers docker resolve-opts allow-dup-ip init-addr last,libc,none
    # Always restart in stable-only mode; an explicit command starts the canary.
    server stable stable:8080 check weight 100
    server canary canary:8080 check weight 0
    # At 100% canary, a failed health check still leaves a warm stable route.
    server stable_fallback stable:8080 check backup weight 100
